# Settings come from the environment. `yarn api:dev` loads .env.local (see .env.example) into it.
spring:
  application:
    name: coffee-delivery-api
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT}/${POSTGRES_DB}
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}
  flyway:
    locations: classpath:db/migration

orders:
  retention:
    # The address of an order is cleared this many days after the order (a whole number, at least 1),
    # by a job that runs on this schedule (Spring cron: second minute hour day month weekday).
    days: ${ORDERS_RETENTION_DAYS:90}
    cron: ${ORDERS_RETENTION_CRON:0 0 3 * * *}

server:
  port: 3000

management:
  endpoints:
    web:
      exposure:
        include: health
  metrics:
    distribution:
      percentiles-histogram:
        "[http.server.requests]": true
  tracing:
    sampling:
      probability: 1.0
  opentelemetry:
    tracing:
      export:
        otlp:
          endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4318}/v1/traces
  otlp:
    metrics:
      export:
        url: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4318}/v1/metrics
        step: 10s

logging:
  structured:
    format:
      console: logstash
