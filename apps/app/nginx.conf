# The static server of the app image (spec 037). The API container is called `api` on the compose
# network.
server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;

  # The API: the path is sent as it is, so /api/v1/coffees reaches the API as /api/v1/coffees.
  location /api/ {
    proxy_pass http://api:3000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Hashed files never change, so a year, and immutable.
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  # The page is read again every time, so a new build is seen at once.
  location = /index.html {
    add_header Cache-Control "no-cache";
  }

  # Every other path is a screen of the client router.
  location / {
    try_files $uri /index.html;
  }
}
