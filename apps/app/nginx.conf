# The static server of the app image (spec 037). The API container is called `api` on the compose
# network.
# The rate limit of the orders (spec 038): 10 requests a minute for each client address, with a burst
# of 5 (the rate is here, the burst is on the limit_req line of the orders location). Only POST is
# counted: for any other method the key is empty, and nginx does not limit an empty key.
map $request_method $orders_limit_key {
  POST $binary_remote_addr;
  default "";
}
limit_req_zone $orders_limit_key zone=orders:10m rate=10r/m;

server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;

  # POST /api/v1/orders is limited. Over the limit the answer is a 429 with the error body of the API.
  location = /api/v1/orders {
    limit_req zone=orders burst=5 nodelay;
    limit_req_status 429;
    error_page 429 @too_many_orders;
    proxy_pass http://api:3000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location @too_many_orders {
    default_type application/json;
    add_header Retry-After 60 always;
    return 429 '{"error":{"code":"too_many_requests","message":"Too many requests. Please wait a minute and try again."}}';
  }

  # The API: the path is sent as it is, so /api/v1/coffees reaches the API as /api/v1/coffees.
  location /api/ {
    proxy_pass http://api:3000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Hashed files never change, so a year, and immutable.
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  # The page is read again every time, so a new build is seen at once.
  location = /index.html {
    add_header Cache-Control "no-cache";
  }

  # Every other path is a screen of the client router.
  location / {
    try_files $uri /index.html;
  }
}
