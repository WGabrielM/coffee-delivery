# Local development infrastructure: PostgreSQL and Grafana LGTM (Loki, Grafana, Tempo, Prometheus, OpenTelemetry collector).
# Run it with `yarn infra:up`; values come from .env.local (see .env.example). Ports are bound to this machine only.
name: coffee-delivery

services:
  postgres:
    image: postgres:18.6-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in .env.local (run yarn env:setup)}
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env.local (run yarn env:setup)}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env.local (run yarn env:setup)}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:?Set POSTGRES_PORT in .env.local (run yarn env:setup)}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready --username=$${POSTGRES_USER} --dbname=$${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  grafana:
    image: grafana/otel-lgtm:0.39.0
    restart: unless-stopped
    ports:
      - "127.0.0.1:3030:3000"
      - "127.0.0.1:4317:4317"
      - "127.0.0.1:4318:4318"
    volumes:
      # The dashboard of the API is provisioned from files (spec 008): edit them, not the UI.
      - ./infra/grafana/provisioning/dashboards/coffee-delivery.yaml:/otel-lgtm/grafana/conf/provisioning/dashboards/coffee-delivery.yaml:ro
      - ./infra/grafana/dashboards:/otel-lgtm/coffee-delivery-dashboards:ro
    healthcheck:
      # bash, not curl: the check must not depend on a tool the image may not ship.
      test:
        - CMD
        - bash
        - -c
        - exec 3<>/dev/tcp/127.0.0.1/3000 && printf 'GET /api/health HTTP/1.0\r\n\r\n' >&3 && head -n 1 <&3 | grep -q ' 200 ' && (exec 4<>/dev/tcp/127.0.0.1/4317) && (exec 4<>/dev/tcp/127.0.0.1/4318)
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s

volumes:
  postgres-data:
